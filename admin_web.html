 vals.forEach((v,i)=>{const h=Math.max(v?2:0,(H-6)*v/mx);s+=`<rect class="${cls}" x="${4+i*bw+bw*.14}" y="${H-h}" width="${bw*.72}" height="${h}" rx="${Math.min(4,bw*.3)}"><title>${labels[i]}: ${fmt(v)}${unit}</title></rect>`});
 const step=Math.ceil(n/7);labels.forEach((l,i)=>{if(i%step===0||i===n-1&&n<=10)s+=`<text x="${4+i*bw+bw/2}" y="${H+13}" text-anchor="middle">${l}</text>`});

const EMO=/(?:\p{Extended_Pictographic}|\p{Regional_Indicator}|️|‍|⃣)+\s?/gu;
function deEmoji(root){
 root.querySelectorAll("h1,h2,h3,summary,.btn,button,.kpi .l,.kpi .s,.pill,label,th,.note,.seg button,.chip,.mut,p").forEach(el=>{
  if(el.closest("td")&&!el.matches(".pill"))return;
  el.childNodes.forEach(n=>{if(n.nodeType===3&&EMO.test(n.nodeValue)){EMO.lastIndex=0;n.nodeValue=n.nodeValue.replace(EMO,"")}EMO.lastIndex=0})})}
function countUp(root){
 root.querySelectorAll(".kpi .v").forEach(el=>{
  const t=el.textContent, m=t.match(/^([^\d-]*)(-?[\d\s .,]+)(.*)$/); if(!m)return;
  const num=parseFloat(m[2].replace(/[\s ]/g,"").replace(",","."));if(!isFinite(num)||num===0)return;
  const dec=(m[2].split(/[.,]/)[1]||"").length, t0=performance.now(), D=900;
  const f=x=>m[1]+(dec?x.toFixed(dec):Math.round(x).toLocaleString("ru-RU"))+m[3];
  (function tick(now){const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);el.textContent=f(num*e);if(p<1)requestAnimationFrame(tick);else el.textContent=t})(t0)})}
let _lastAnim="";
const _mainObs=new MutationObserver(()=>{const mn=$("#main");if(!mn)return;_mainObs.disconnect();
 deEmoji(mn);
 if(!mn.querySelector(".sk")&&_lastAnim!==location.hash){_lastAnim=location.hash;mn.classList.remove("anim");void mn.offsetWidth;mn.classList.add("anim");countUp(mn)}
 _mainObs.observe(mn,{childList:true})});
window.addEventListener("hashchange",()=>{_lastAnim=""});
const _origRoute=route;
route=async function(){const mn=$("#main");if(mn){_mainObs.disconnect();_mainObs.observe(mn,{childList:true})}return _origRoute()};
